# Lab SOC : Zeek -> Filebeat -> Elasticsearch -> Kibana
# A lancer sur la VM Linux de supervision (Zeek a besoin du mode reseau "host"
# pour ecouter l'interface, ce que Docker Desktop sous Windows ne permet pas).

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Definit le mot de passe du compte technique utilise par Kibana, puis s'arrete.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c '
        curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}"
        -H "Content-Type: application/json"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"${KIBANA_PASSWORD}\"}"
      '

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"

  zeek:
    image: zeek/zeek:lts
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    working_dir: /logs
    volumes:
      - zeeklogs:/logs
    # -C : ignore les checksums invalides (frequent en VM)
    command: zeek -C -i ${ZEEK_INTERFACE} policy/tuning/json-logs
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - zeeklogs:/zeek-logs:ro
    command: filebeat -e --strict.perms=false

volumes:
  esdata:
  zeeklogs:
